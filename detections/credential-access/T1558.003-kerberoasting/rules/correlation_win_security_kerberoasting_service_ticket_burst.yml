title: Kerberos Service Ticket Requested For User Account SPN
id: ad72a164-2119-473e-88f7-e616ec48a6e5
name: kerberos_service_ticket_user_account_spn
status: experimental
description: |
    Base rule for the Kerberoasting burst correlation defined below in this file.
    Matches successful Kerberos service ticket requests (4769) for service principals backed by user accounts, i.e. not
    computer accounts, gMSAs or krbtgt, regardless of the ticket encryption type.
    On its own this is normal domain activity and is not meant to alert; the correlation rule counts distinct services per requester.
author: aliaba2000
date: 2026-10-24
tags:
    - attack.credential-access
    - attack.t1558.003
logsource:
    product: windows
    service: security
    definition: 'Requirements: Audit Kerberos Service Ticket Operations (Success) on all domain controllers'
detection:
    selection:
        EventID: 4769
        Status: '0x0'
    filter_main_computer_and_gmsa:
        ServiceName|endswith: '$'
    filter_main_krbtgt:
        ServiceName: 'krbtgt'
    condition: selection and not 1 of filter_main_*
falsepositives:
    - Expected - this is a base rule for a correlation and is not meant to alert on its own
level: informational
