name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Sanitize (no private identifiers or secrets)
        run: python3 scripts/sanitize_check.py

      - name: Sigma check (SigmaHQ validator configuration)
        run: sigma check --fail-on-error --fail-on-issues -c tests/sigma_cli_conf.sigmahq.yml detections/*/*/rules/

      - name: Generated SPL matches the rules
        run: ./scripts/convert.sh --check

      - name: Coverage table is current
        run: python3 scripts/coverage.py --check

      - name: Cache public datasets
        uses: actions/cache@v4
        with:
          path: .cache/datasets
          key: datasets-${{ hashFiles('detections/**/tests/tests.yml') }}

      - name: Detection tests
        run: python3 scripts/run_tests.py
